<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>英文跟讀小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
:root{
  --bg:#E8F3FB; --surface:#FFFFFF; --surface2:#F3F8FC; --ink:#1B2A4A; --muted:#5A6A8A; --line:#D3E2EF;
  --leaf:#23A866; --leaf-ink:#FFFFFF; --leaf-soft:#D9F4E6;
  --sun:#FFC23A; --sun-soft:#FFF1C9; --coral:#FF6A55; --coral-soft:#FFE3DE; --sky:#2F86D8; --sky-soft:#DCEBFA;
  --hl:#FFE08A; --hl-ink:#1B2A4A; --shadow:0 6px 0 rgba(27,42,74,.10);
  --f-disp:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1930; --surface:#172642; --surface2:#1D2E4F; --ink:#EEF3FB; --muted:#9FB1CF; --line:#2B3E62;
    --leaf:#34C27B; --leaf-ink:#06210F; --leaf-soft:#173D2C;
    --sun:#FFC94F; --sun-soft:#3D3316; --coral:#FF7C69; --coral-soft:#43221F; --sky:#5AA6EE; --sky-soft:#1B3355;
    --hl:#FFD35C; --hl-ink:#1B2A4A; --shadow:0 6px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1930; --surface:#172642; --surface2:#1D2E4F; --ink:#EEF3FB; --muted:#9FB1CF; --line:#2B3E62;
  --leaf:#34C27B; --leaf-ink:#06210F; --leaf-soft:#173D2C;
  --sun:#FFC94F; --sun-soft:#3D3316; --coral:#FF7C69; --coral-soft:#43221F; --sky:#5AA6EE; --sky-soft:#1B3355;
  --hl:#FFD35C; --hl-ink:#1B2A4A; --shadow:0 6px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-family:var(--f-disp);font-weight:600;font-size:17px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(27,42,74,.10)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:transparent}
.btn.sun{background:var(--sun);color:#1B2A4A;border-color:transparent}
.btn.ghost{box-shadow:none;background:transparent}
.btn.small{min-height:38px;font-size:15px;padding:0 14px;border-radius:12px}
.btn svg{width:22px;height:22px;flex:none}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;flex:none}
.logo svg{width:28px;height:28px}
.brand h1{font-size:26px}
.brand small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1fr;gap:16px;background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)}
.hero h2{font-size:clamp(24px,4vw,34px)}
.hero p{margin:6px 0 16px;color:var(--muted);max-width:46ch}
.entry{display:flex;flex-direction:column;min-width:0}
.entry-form{display:flex;flex-direction:column;gap:8px}
.entry-form textarea{font-size:17px;line-height:1.55;min-height:170px}
.hints{margin:0;padding-left:20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--surface2);padding:1px 6px;border-radius:6px;color:var(--ink)}
.err{margin:0;color:var(--coral);font-weight:700}
.confirm{font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--coral-soft);border-radius:12px;padding:8px 10px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{background:var(--surface2);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.step b{font-family:var(--f-disp);font-size:22px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sun);color:#1B2A4A}
.step span{font-size:14px;color:var(--muted)}
.step strong{display:block;color:var(--ink);font-size:15px}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.section-h{display:flex;align-items:baseline;gap:10px}
.section-h h3{font-size:22px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lesson{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lesson h4{margin:0;font-family:var(--f-disp);font-size:20px;line-height:1.2}
.lesson .first{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;padding:2px 10px;border-radius:99px;background:var(--sky-soft);color:var(--sky)}
.tag.sample{background:var(--sun-soft);color:#9A6A00}
:root[data-theme="dark"] .tag.sample{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.sample{color:var(--sun)}}
.lesson .row .btn{flex:1}
.paste{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical}
.notice{border-radius:16px;padding:12px 16px;background:var(--coral-soft);color:var(--ink);font-size:15px}
.notice.info{background:var(--sky-soft)}

/* ---------- busy ---------- */
.busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;z-index:50;padding:16px}
.busy .card{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:28px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:var(--shadow)}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--leaf);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toggle{display:flex;gap:12px;align-items:flex-start;background:var(--leaf-soft);border-radius:14px;padding:10px 12px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--leaf);margin:2px 0 0;flex:none}
.toggle b{display:block}
.toggle span{font-size:14px;color:var(--muted)}
.toggle.off{background:var(--surface2);cursor:not-allowed;opacity:.75}

/* ---------- edit ---------- */
.sent-list{display:flex;flex-direction:column;gap:12px}
.sent{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:start}
.sent .n{font-family:var(--f-disp);font-weight:700;font-size:18px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf)}
.sent .fields{display:flex;flex-direction:column;gap:8px;min-width:0}
.sent .spk{max-width:180px;font-size:14px;padding:6px 10px}
.sent textarea{min-height:48px}
.sent textarea.en{font-size:18px;font-weight:700}
.sent textarea.zh{font-family:var(--f-zh)}
.sent .tools{display:flex;flex-direction:column;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.danger{color:var(--coral)}
@media (max-width:520px){.sent{grid-template-columns:1fr auto}.sent .n{display:none}}
.sticky-foot{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- play ---------- */
.play{max-width:1100px}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:32px;padding:clamp(18px,3vw,36px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:600;color:var(--muted)}
.bar{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .35s}
.speaker{align-self:flex-start;font-family:var(--f-disp);font-weight:600;font-size:16px;padding:4px 14px;border-radius:99px;background:var(--sky-soft);color:var(--sky)}
.en-big{font-family:var(--f-disp);font-weight:600;font-size:clamp(30px,5.4vw,58px);line-height:1.25;letter-spacing:.005em;cursor:pointer;min-height:1.25em}
.en-big .w{border-radius:10px;padding:0 .06em;transition:background .12s,color .12s;display:inline}
.en-big .w.on{background:var(--hl);color:var(--hl-ink)}
.en-big.speaking-all .w{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.en-big.dim{opacity:.35}
.zh-big{font-family:var(--f-zh);font-size:clamp(20px,2.8vw,28px);color:var(--muted);font-weight:500;min-height:1.4em}
.zh-big{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;margin-inline:-14px;border-radius:18px;transition:background .2s,color .2s}
.zh-big .lbl{font-family:var(--f-body);font-size:13px;font-weight:800;letter-spacing:.05em;padding:2px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);flex:none}
.zh-big.turn{background:var(--sun-soft);color:var(--ink)}
.zh-big.turn .lbl{background:var(--sun);color:#1B2A4A}
.zh-big.hidden-zh .txt{filter:blur(9px);user-select:none}
.zh-big.hidden-zh{cursor:pointer}
.zh-big .none{font-size:16px;color:var(--muted)}
.sent textarea.zh.need{border-color:var(--coral);background:var(--coral-soft)}
.buddy{display:flex;align-items:center;gap:16px;background:var(--surface2);border-radius:24px;padding:12px 16px}
.cue{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--muted)}
.cue svg{width:38px;height:38px}
.buddy.listen .cue{background:var(--leaf);color:var(--leaf-ink);animation:pulse 1s ease-in-out infinite}
.buddy.turn .cue{background:var(--coral);color:#fff}
.buddy.ready .cue{background:var(--sun);color:#1B2A4A}
@keyframes pulse{50%{transform:scale(1.07)}}
.buddy .say{font-family:var(--f-disp);font-weight:600;font-size:clamp(20px,2.6vw,26px)}
.buddy .say small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}
.ring{width:64px;height:64px;flex:none;margin-left:auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--coral);stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:0}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:20px}
.buddy.turn{background:var(--coral-soft)}
.buddy.listen{background:var(--leaf-soft)}
.buddy.ready{background:var(--sun-soft)}

.controls{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;gap:12px;align-items:stretch}
.cbtn{min-height:76px;border-radius:24px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-disp);font-weight:600;font-size:15px;transition:transform .08s}
.cbtn:active{transform:translateY(3px)}
.cbtn svg{width:30px;height:30px}
.cbtn.main{background:var(--leaf);color:var(--leaf-ink);border-color:transparent;font-size:18px}
.cbtn.main svg{width:40px;height:40px}
.cbtn.next-ready{background:var(--sun);color:#1B2A4A;border-color:transparent;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}
@media (max-width:560px){.controls{grid-template-columns:repeat(3,1fr)}.controls .c-restart,.controls .c-again{grid-column:span 1}.cbtn.main{grid-column:span 3;order:-1}}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.set{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.set label.t{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-family:var(--f-disp);font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 rgba(27,42,74,.12)}
.set select{padding:8px 10px}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{min-width:40px;height:40px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-family:var(--f-disp);font-weight:600;color:var(--muted)}
.dot.done{background:var(--leaf-soft);color:var(--leaf);border-color:transparent}
.dot.cur{background:var(--sun);color:#1B2A4A;border-color:transparent}

/* ---------- celebrate ---------- */
.celebrate{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 94%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5}
.celebrate h2{font-size:clamp(28px,4vw,42px)}
.stars{display:flex;gap:8px}
.stars svg{width:48px;height:48px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars svg:nth-child(2){animation-delay:.12s}.stars svg:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
(() => {
"use strict";
let view = { name: "home" };
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bubble: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5h16v11H10l-4 3.5V16H4z"/><path d="M8 10.5h8" stroke-linecap="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1.5"/><rect x="14" y="4" width="4.5" height="16" rx="1.5"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="3" height="14" rx="1.2"/><path d="M20 5.8v12.4a1 1 0 0 1-1.55.83L9.6 13.2a1.4 1.4 0 0 1 0-2.4l8.85-5.83A1 1 0 0 1 20 5.8z"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="17" y="5" width="3" height="14" rx="1.2"/><path d="M4 5.8v12.4a1 1 0 0 0 1.55.83l8.85-5.83a1.4 1.4 0 0 0 0-2.4L5.55 4.97A1 1 0 0 0 4 5.8z"/></svg>',
  again: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>',
  restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v6h6"/><path d="M3.5 11A9 9 0 1 1 6 17.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path fill="#FFC23A" stroke="#E0A000" stroke-width="1.2" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>'
};

/* ============ data ============ */
const SAMPLE = {
  id: "sample", sample: true, title: "My Busy Morning", created: 0,
  sentences: [
    { speaker: "", en: "It is seven o'clock in the morning.", zh: "現在是早上七點。" },
    { speaker: "", en: "Amy wakes up and opens the window.", zh: "艾咪起床，打開窗戶。" },
    { speaker: "Mom", en: "Good morning, Amy! Breakfast is ready.", zh: "早安，艾咪！早餐準備好了。" },
    { speaker: "Amy", en: "Good morning, Mom! What do we have today?", zh: "早安，媽媽！我們今天吃什麼？" },
    { speaker: "Mom", en: "We have eggs, toast, and warm milk.", zh: "我們有蛋、吐司和熱牛奶。" },
    { speaker: "Amy", en: "Yummy! I like eggs very much.", zh: "好好吃！我非常喜歡吃蛋。" },
    { speaker: "", en: "After breakfast, Amy brushes her teeth.", zh: "吃完早餐後，艾咪刷牙。" },
    { speaker: "", en: "She puts on her shoes and takes her school bag.", zh: "她穿上鞋子，拿起書包。" },
    { speaker: "Amy", en: "Bye, Mom! See you after school.", zh: "媽媽再見！放學後見。" }
  ]
};
let lessons = store.get("parrot-lessons-v1", null);

/* Free web translation (works when opened directly in Safari / Chrome) */
async function googleTranslate(text) {
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=" + encodeURIComponent(text);
  const r = await fetch(url); if (!r.ok) throw new Error("google " + r.status);
  const j = await r.json();
  const out = (j?.[0] || []).map(seg => seg?.[0] || "").join("").trim();
  if (!out) throw new Error("google empty"); return out;
}
async function myMemoryTranslate(text) {
  const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|zh-TW&q=" + encodeURIComponent(text));
  if (!r.ok) throw new Error("mymemory " + r.status);
  const j = await r.json(); const out = String(j?.responseData?.translatedText || "").trim();
  if (!out || j?.responseStatus >= 400 || /MYMEMORY WARNING/i.test(out)) throw new Error("mymemory quota"); return out;
}
async function webTranslateAll(list, onProgress) {
  const out = new Array(list.length); let next = 0, done = 0, failed = 0;
  async function worker() {
    while (next < list.length) {
      const k = next++;
      try { out[k] = await googleTranslate(list[k]); }
      catch { try { out[k] = await myMemoryTranslate(list[k]); } catch { failed++; } }
      onProgress?.(++done, list.length);
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  if (failed === list.length) throw { code: "network" };
  return out;
}
async function claudeTranslateAll(list) {
  const prompt = `把下面的英文句子翻成自然、小學生看得懂的繁體中文（台灣用語）。只回傳 JSON 字串陣列，長度 ${list.length}，順序相同。

${JSON.stringify(list)}`;
  const out = await sampleFn.json(prompt, { modelTier: "quick" });
  if (!Array.isArray(out)) throw { code: "invalid_json" };
  return out;
}
async function translateMissing(sentences) {
  const idx = sentences.map((s, i) => (!s.zh && s.en ? i : -1)).filter(i => i >= 0);
  if (!idx.length) return 0;
  const list = idx.map(i => sentences[i].en);
  const progress = (d, n) => { const el = $("#busySub"); if (el) el.textContent = `已翻好 ${d} / ${n} 句`; };
  let out;
  if (sampleFn) {
    try { out = await claudeTranslateAll(list); }
    catch (e) { try { out = await webTranslateAll(list, progress); } catch { throw e; } }
  } else out = await webTranslateAll(list, progress);
  let filled = 0;
  idx.forEach((i, k) => { if (out[k]) { sentences[i].zh = String(out[k]).trim(); filled++; } });
  if (filled < idx.length) throw { code: "partial", n: idx.length - filled };
  return filled;
}

function splitText(text) {
  const protect = t => t.replace(/\b(Mr|Mrs|Ms|Dr|St|Mt)\./g, "$1\u0001");
  const res = [];
  for (let line of text.split(/\n+/)) {
    line = line.trim(); if (!line) continue;
    let speaker = "", zh = "";
    const bar = line.split(/\s*[|｜]\s*/);
    if (bar.length > 1) { line = bar[0]; zh = bar.slice(1).join(" ").trim(); }
    const m = line.match(/^([A-Z][A-Za-z .'-]{0,20}):\s*(.+)$/);
    if (m) { speaker = m[1].trim(); line = m[2]; }
    if (zh) { if (line.trim()) res.push({ speaker, en: line.trim(), zh }); continue; }
    protect(line).replace(/([.!?]+["”’']?)\s+/g, "$1\n").split("\n").forEach(p => {
      p = p.replace(/\u0001/g, ".").trim();
      if (p) res.push({ speaker, en: p, zh: "" });
    });
  }
  return res;
}

/* ============ speech ============ */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang) || v.lang === "en");
  const score = v => (/en[-_]US/i.test(v.lang) ? 4 : /en[-_]GB/i.test(v.lang) ? 3 : 1) + (/Samantha|Google US|Aria|Jenny|Ava|Allison|Karen/i.test(v.name) ? 3 : 0) + (v.localService ? 1 : 0);
  voices.sort((a, b) => score(b) - score(a));
  if (view.name === "play") updateVoiceSelect();
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
const pickVoice = () => voices.find(v => v.voiceURI === settings.voice) || voices[0] || null;

function speak(text, { onWord, rate = settings.rate } = {}) {
  return new Promise(resolve => {
    if (!synth) { setTimeout(resolve, 1200); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v) u.voice = v;
    u.lang = v?.lang || "en-US"; u.rate = rate; u.pitch = 1.05;
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(guard); resolve(); } };
    const words = text.split(/\s+/).length;
    const guard = setTimeout(finish, (words * 700) / rate + 4000);
    u.onboundary = e => { if (e.name === "word" || e.name === undefined) onWord?.(e.charIndex); };
    u.onend = finish; u.onerror = finish;
    synth.speak(u);
  });
}
const sleep = (ms, tok) => new Promise(r => { const t = setTimeout(r, ms); if (tok) tok.timers.push(t); });

  app.querySelectorAll("textarea").forEach(autoGrow);

function autoGrow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + 4 + "px"; }
function commitDraft() {
  const d = draft;
  d.sentences = d.sentences.map(s => ({ speaker: s.speaker.trim(), en: s.en.trim(), zh: s.zh.trim() })).filter(s => s.en);
  if (!d.sentences.length) { renderEdit("至少需要一句英文喔！"); return null; }
  const { fresh, okMissing, autoTried, ...clean } = d;
  clean.title = clean.title.trim() || "我的課文";
  const i = lessons.findIndex(l => l.id === d.id);
  if (i >= 0) lessons[i] = clean; else lessons.push(clean);
  saveLessons();
  if (d.fresh) { store.set("parrot-input-draft-v1", { title: "", text: "" }); delete d.fresh; }
  return d.id;
}

      <div class="set"><label class="t" for="voiceSel">聲音</label><select id="voiceSel"></select></div>
    </div>
    <div class="set"><span class="t" style="font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted)">跳到第幾句</span><div class="dots" id="dots"></div></div>
    ${!synth ? `<div class="notice">這個瀏覽器不支援語音朗讀，請改用 Safari 或 Chrome。</div>` : ""}
  </div>`;

  $("#back").onclick = () => go("home");
  $("#pp").onclick = togglePlay;
  $("#prev").onclick = () => jump(P.idx - 1);
  $("#next").onclick = () => jump(P.idx + 1);
  $("#again").onclick = () => jump(P.idx);
  $("#restart").onclick = () => { P.done.clear(); jump(0); };
  $("#en").onclick = e => {
    const w = e.target.closest(".w");
    if (w && P.phase !== "speaking") { stopPlayback(true); speak(w.dataset.word, { rate: Math.min(settings.rate, 0.9) }); return; }
    jump(P.idx);
  };
  $("#zh").onclick = () => { const z = $("#zh"); if (z.classList.contains("hidden-zh")) z.classList.remove("hidden-zh"); };
  app.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const key = seg.dataset.key; let val = b.dataset.v;
    val = val === "true" ? true : val === "false" ? false : isNaN(+val) ? val : +val;
    settings[key] = val; saveSettings();
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (key === "showZh") showSentence();
  }));
  $("#voiceSel").onchange = e => { settings.voice = e.target.value; saveSettings(); synth?.cancel(); speak("Hello! Let's read together."); };
  updateVoiceSelect();
  showSentence();
  setPhase("idle");
}
function segSet(label, key, opts) {
  return `<div class="set"><span class="t" style="font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted)">${label}</span>
    <div class="seg" data-key="${key}" role="group" aria-label="${label}">${opts.map(([v, t]) => `<button data-v="${v}" aria-pressed="${String(settings[key]) === String(v)}">${t}</button>`).join("")}</div></div>`;
}
function updateVoiceSelect() {
  const sel = $("#voiceSel"); if (!sel) return;
  const cur = pickVoice();
  sel.innerHTML = voices.length ? voices.map(v => `<option value="${esc(v.voiceURI)}" ${v === cur ? "selected" : ""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("") : `<option>系統預設英文聲音</option>`;
}

function showSentence() {
  const s = P.lesson.sentences[P.idx], n = P.lesson.sentences.length;
  $("#pnum").textContent = `${P.idx + 1} / ${n}`;
  $("#pbar").style.width = `${((P.idx + 1) / n) * 100}%`;
  const spk = $("#spk"); spk.hidden = !s.speaker; spk.textContent = s.speaker;
  // word spans with char offsets
  let html = "", re = /\S+/g, m, last = 0;
  while ((m = re.exec(s.en))) {
    html += esc(s.en.slice(last, m.index));
    const word = m[0].replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, "");
    html += `<span class="w" data-s="${m.index}" data-e="${m.index + m[0].length}" data-word="${esc(word || m[0])}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  $("#en").innerHTML = html;
  renderZh(false);
  $("#dots").innerHTML = P.lesson.sentences.map((_, i) => `<button class="dot ${i === P.idx ? "cur" : P.done.has(i) ? "done" : ""}" data-j="${i}" aria-label="第 ${i + 1} 句">${i + 1}</button>`).join("");
  $("#dots").onclick = e => { const b = e.target.closest("[data-j]"); if (b) jump(+b.dataset.j); };
}
function renderZh(turn) {
  const s = P.lesson.sentences[P.idx], zh = $("#zh"); if (!zh) return;
  zh.innerHTML = s.zh
    ? `<span class="lbl">中文</span><span class="txt">${esc(s.zh)}</span>`
    : `<span class="lbl">中文</span><span class="none">這句還沒有中文翻譯，可以到「編輯」補上</span>`;
  zh.classList.toggle("turn", turn);
  zh.classList.toggle("hidden-zh", !!s.zh && !turn && settings.showZh === "turn");
}
function highlightAt(ci) {
  const spans = app.querySelectorAll("#en .w");
  $("#en").classList.remove("speaking-all");
  spans.forEach(sp => sp.classList.toggle("on", ci >= +sp.dataset.s && ci < +sp.dataset.e));
}
function clearHighlight() { app.querySelectorAll("#en .w.on").forEach(x => x.classList.remove("on")); $("#en")?.classList.remove("speaking-all"); }

function setPhase(ph, extra = {}) {
  P.phase = ph;
  const say = $("#say"), buddy = $("#buddy"), cue = $("#cue"), pp = $("#pp"), nx = $("#next"), ring = $("#ring");
  if (!say) return;
  buddy.className = "buddy"; ring.hidden = true; nx.classList.remove("next-ready");
  renderZh(ph === "waiting" || ph === "ready" || ph === "done");
  const playing = ph === "speaking" || ph === "waiting";
  pp.innerHTML = playing ? `${ICON.pause}暫停` : `${ICON.play}${ph === "idle" && !P.started ? "開始" : "播放"}`;
  pp.setAttribute("aria-label", playing ? "暫停" : "播放");
  if (ph === "speaking") {
    buddy.classList.add("listen"); cue.innerHTML = ICON.speaker;
    say.innerHTML = `仔細聽… <small>${extra.rep > 1 ? `第 ${extra.r} / ${extra.rep} 次` : "先聽一次"}</small>`;
  } else if (ph === "waiting") {
    buddy.classList.add("turn"); cue.innerHTML = ICON.mic;
    say.innerHTML = `換你唸！ <small>看著英文大聲說一次，想想中文的意思</small>`;
    ring.hidden = false;
  } else if (ph === "ready") {
    buddy.classList.add("ready"); cue.innerHTML = ICON.check;
    say.innerHTML = `唸得好！ <small>按「下一句」繼續，或點句子再聽一次</small>`;
    nx.classList.add("next-ready");
  } else if (ph === "paused") {
    cue.innerHTML = ICON.pause;
    say.innerHTML = `暫停中 <small>按播放從這一句繼續</small>`;
  } else {
    cue.innerHTML = ICON.bubble; say.innerHTML = `準備好了嗎？ <small>按「開始」，聽一句、跟一句</small>`;
  }
}

function stopPlayback(keepPhase) {
  if (P?.tok) { P.tok.dead = true; P.tok.timers.forEach(clearTimeout); cancelAnimationFrame(P.tok.raf); }
  if (P) P.tok = null;
  synth?.cancel();
  if (view.name === "play" && P && $("#en")) { clearHighlight(); if (!keepPhase) setPhase("paused"); }
  releaseWake();
}
function togglePlay() {
  if (P.phase === "speaking" || P.phase === "waiting") stopPlayback();
  else if (P.phase === "done") { P.done.clear(); jump(0); }
  else if (P.phase === "ready") jump(P.idx + 1);
  else run();
}
function jump(i) {
  const n = P.lesson.sentences.length;
  if (i < 0) i = 0;
  if (i >= n) { finish(); return; }
  stopPlayback(true);
  $(".celebrate")?.remove();
  P.idx = i; showSentence(); run();
}
async function run() {
  stopPlayback(true);
  const tok = { dead: false, timers: [], raf: 0 };
  P.tok = tok; P.started = true;
  requestWake();
  const s = P.lesson.sentences[P.idx];
  const rep = settings.repeat;
  for (let r = 1; r <= rep; r++) {
    setPhase("speaking", { r, rep });
    $("#en").classList.add("speaking-all");
    await speak(s.en, { onWord: ci => !tok.dead && highlightAt(ci) });
    if (tok.dead) return;
    clearHighlight();
    if (r < rep) await sleep(600, tok);
    if (tok.dead) return;
  }
  // child's turn
  const words = s.en.split(/\s+/).length;
  const secs = settings.wait === "auto" ? Math.max(2.5, Math.round((words * 0.55 / settings.rate + 1.3) * 2) / 2) : settings.wait;
  setPhase("waiting");
  await countdown(secs, tok);
  if (tok.dead) return;
  P.done.add(P.idx);
  releaseWake();
  if (settings.mode === "auto") {
    if (P.idx + 1 >= P.lesson.sentences.length) { finish(); return; }
    await sleep(400, tok); if (tok.dead) return;
    P.idx++; showSentence(); run();
  } else {
    P.tok = null;
    showSentence();
    if (P.idx + 1 >= P.lesson.sentences.length) finish(); else setPhase("ready");
  }
}
function countdown(secs, tok) {
  return new Promise(res => {
    const fill = $("#ringFill"), num = $("#ringNum"), C = 176, t0 = performance.now(), dur = secs * 1000;
    const step = now => {
      if (tok.dead) { res(); return; }
      const p = Math.min(1, (now - t0) / dur);
      fill.style.strokeDashoffset = String(C * p);
      num.textContent = Math.ceil((dur - (now - t0)) / 1000) || "";
      if (p >= 1) res(); else tok.raf = requestAnimationFrame(step);
    };
    tok.raf = requestAnimationFrame(step);
  });
}
function finish() {
  stopPlayback(true);
  P.done = new Set(P.lesson.sentences.map((_, i) => i));
  showSentence(); setPhase("idle"); P.phase = "done";
  $("#pp").innerHTML = `${ICON.restart}再玩一次`;
  $("#say").innerHTML = `全部唸完了！ <small>好厲害，再挑戰一次或換快一點的語速吧</small>`;
  $("#cue").innerHTML = ICON.check; $("#buddy").classList.add("ready");
  const c = document.createElement("div");
  c.className = "celebrate";
  c.innerHTML = `<div class="stars">${ICON.star.repeat(3)}</div><h2>全部唸完了，好棒！</h2><p class="muted">這一課共 ${P.lesson.sentences.length} 句</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="again2">${ICON.restart}再玩一次</button><button class="btn" id="home2">回首頁</button></div>`;
  $("#stage").append(c);
  $("#again2").onclick = () => { P.done.clear(); jump(0); };
  $("#home2").onclick = () => go("home");
}
async function requestWake() { try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", () => wakeLock = null); } } catch {} }
function releaseWake() { try { wakeLock?.release(); } catch {} wakeLock = null; }

document.addEventListener("keydown", e => {
  if (view.name !== "play" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowRight") jump(P.idx + 1);
  else if (e.key === "ArrowLeft") jump(P.idx - 1);
});
document.addEventListener("visibilitychange", () => { if (document.hidden && view.name === "play" && P && (P.phase === "speaking" || P.phase === "waiting")) stopPlayback(); });

render();
})();
</script>
</body></html>
