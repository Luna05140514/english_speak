<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英文跟讀">
<title>英文跟讀</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="player/player.css">
<style>
.list{display:flex;flex-direction:column;gap:12px}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:16px 18px;text-decoration:none;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.lesson:hover{box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(20,40,70,.4)}
.lesson:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--sky);background:var(--sky-soft);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.info{min-width:0}
.info b{font-family:var(--display);font-size:1.3rem;display:block;line-height:1.2;overflow-wrap:anywhere}
.info span{color:var(--muted);font-size:.9rem}
.prog{font-size:.85rem;color:var(--leaf);font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header><div><h1>英文跟讀</h1><p class="sub">選一課開始：聽一句，跟著唸一句</p></div></header>
  <nav class="list" id="list"><p class="sub">讀取課程中…</p></nav>
</div>
<script src="player/lessons.js"></script>
<script>
(async()=>{
  const list=document.getElementById('list');
  const folders=await GenduLessons.listLessons();
  list.innerHTML='';
  if(!folders.length){list.innerHTML='<p class="sub">還沒有課程。請在 GitHub 的 lessons 資料夾裡新增一課。</p>';return}
  folders.forEach((f,i)=>{
    const dn=GenduLessons.displayName(f);
    const done=(GenduLessons.store.get('gendu.'+f+'.done',[])||[]).length;
    const a=document.createElement('a');a.className='lesson';a.href='lesson.html?l='+encodeURIComponent(f);
    a.innerHTML='<div class="num"></div><div class="info"><b></b><span></span></div><div class="prog"></div>';
    a.querySelector('.num').textContent=dn.num||String(i+1);
    a.querySelector('b').textContent=dn.title;
    a.querySelector('span').textContent=dn.num?'Lesson '+dn.num:'';
    a.querySelector('.prog').textContent=done?'唸過 '+done+' 句':'';
    list.appendChild(a);
  });
})();
</script>
</body>
</html>
