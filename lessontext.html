<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>跟讀</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="player/player.css">
</head>
<body>
<div id="app" class="wrap"><a class="back" href="index.html">‹ 所有課程</a><p class="sub" id="msg">載入中…</p></div>
<script src="player/align.js"></script>
<script src="player/lessons.js"></script>
<script src="player/player.js"></script>
<script>
(async()=>{
  const folder=new URLSearchParams(location.search).get('l');
  const msg=t=>{let m=document.getElementById('msg');if(!m){const app=document.getElementById('app');app.innerHTML='<a class="back" href="index.html">‹ 所有課程</a><p class="sub" id="msg"></p>';m=document.getElementById('msg')}m.textContent=t};
  if(!folder){location.replace('index.html');return}
  try{
    const lesson=await GenduLessons.loadLesson(folder,msg);
    GenduPlayer(lesson);
  }catch(e){msg('這一課讀取失敗：'+e.message+'。請確認 lessons/'+folder+'/ 裡有 audio.mp3 和 english.txt。')}
})();
</script>
</body>
</html>
